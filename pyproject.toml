[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-rag-intelligence-platform"
version = "0.1.0"
description = "A public-safe Agentic RAG platform with LangGraph, LangChain, LangSmith, FastAPI, hybrid retrieval, and synthetic data."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "langchain>=0.2",
  "langgraph>=0.1",
  "langsmith>=0.1",
  "chromadb>=0.5",
  "rank-bm25>=0.2",
  "pypdf>=4.0",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
  "black>=24.0",
  "ruff>=0.5",
  "pytest>=8.0",
  "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
  ".git",
  ".venv",
  ".pytest_tmp",
  ".pytest_cache",
  ".pytest_cache_local",
  "data/index",
  "test_artifacts",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "ASYNC", "C4", "SIM"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
addopts = "-q -p no:cacheprovider"
